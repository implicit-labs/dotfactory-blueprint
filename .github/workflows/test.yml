name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: /bin/bash factory/test.sh

  dotfiles:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /bin/bash dotfiles/test.sh

  stable-local-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: /bin/bash skills/stable-local-services/test.sh
